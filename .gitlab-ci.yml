# Step 0, independent: deploy_review, deploy_review_server
# Step 1, quicker: test_tools, test_browser_unit, code_quality_custom, test_server_unit
# Step 2, moderate:
#   client: client_firefox_supported, tuto-c1-ff-supported
#   server: server_firefox_supported, tuto-s1-ff-supported
# Step 3, late, longer or tricky: 
variables:
  CYPRESS_DOCKER_VERSION: "12.9"

.before_script_global: &before_script_global
  # - make demo
  # - make data
  # - make germline
  # - make -C browser sha1
  # - cp -p doc/analysis-example.vidjil browser/
  - echo $CI_COMMIT_REF_SLUG

.before_script_global_docker: &before_script_global_docker
  before_script:
    - apt update && apt upgrade -y && apt install -y make unzip wget
    - *before_script_global

before_script:
  - *before_script_global

stages:
  - test_tools
  - test_quality
  - build_test_server_docker
  - test_unit
  - deploy_review
  - test_germlines
  - test_functional
  - test_cypress_client
  - test_cypress_external
  - test_cypress_server
  - test_server_api
  - test_tutorial
  - test_tutorial_server
  - test_shouldvdj
  - coverage
  - tgz_release
  - build_doc
  - valgrind_unit
  - valgrind_functional
  - multiple_tests
  - benchmark
  - publish_release
  - deploy_prod


# Tools

test_tools:
  image: registry.gitlab.inria.fr/vidjil/vidjil/cypress_with_browsers:$CYPRESS_DOCKER_VERSION
  stage: test_tools
  script:
    - apt-get update && apt-get install -y python3-pip
    - pip3 install beautifulsoup4 bs4 tabulate requests requests-toolbelt urllib3
    - make -C tools/tests
  artifacts:
    reports:
      junit: tools/tests/should.xml
    expire_in: 7 day
    when: always
  extends:
    - .need_for_quick_test
  tags:
    - cidocker


# Germlines

test_germlines:
  image: registry.gitlab.inria.fr/vidjil/vidjil/cypress_with_browsers:$CYPRESS_DOCKER_VERSION
  stage: test_germlines
  script:
    - make -C germline get-all-data
    - make -C germline tests
  only:
    - /^feature-.*g.*\/.*$/
  tags:
    - cidocker


# Includes

include:
  - local: '.gitlab-test-reproducibility.yml' # launch tests many times
  - local: '/doc/.gitlab-ci.yml' # Doc
  - local: 'algo/.gitlab-ci-compilers.yml' # Stage multiple_tests
  - local: 'algo/.gitlab-ci.yml' # Vidjil-algo pipelines
  - local: 'browser/.gitlab-ci.yml' # Client pipelines
  - local: 'server/.gitlab-ci.yml' # Server pipelines
  - local: 'tools/.gitlab-ci.yml' # Tools/API pipelines

###########################
###  Needs declaration  ###
###########################
.need_for_independent_test:
  needs: []

.need_for_quick_test:
  needs: []

### Client part should not containt server stage
.need_for_moderate_client:
  needs: [test_tools, test_browser_unit, code_quality_custom]
.need_for_staged_client:
  needs: [client1-ff-supported, external1-ff-supported]
.need_for_late_client:
  needs: [client1-ff-supported, external1-ff-supported, tuto-c1-ff-supported]

### Server part should not containt client stage
.need_for_moderate_server:
  needs: [test_tools, test_server_unit, build_test_server_docker]
.need_for_late_server:
  needs: [server1-ff-supported, tuto-s1-ff-supported]
.need_for_staged_server:
  needs: [server1-ff-supported, tuto-s1-ff-supported]



# Algorithm

algo_valgrind_unit:
  stage: valgrind_unit
  script: make -C algo valgrind_unit
  only:
    - /^feature-.*a.*\/.*$/
    - schedules
  tags:
    - valgrind

.snip_valgrind_functional: &valgrind_functional
  stage: valgrind_functional
  script: make -C algo valgrind_should
  tags:
    - valgrind

algo_valgrind_functional:
  <<: *valgrind_functional
  when: manual
  dependencies: []
  only:
    - /^feature-.*a.*\/.*$/
    - schedules

release_valgrind_functional:
  <<: *valgrind_functional
  allow_failure: true
  only:
    - /^feature-.*a.*\/release$/

tgz_release:
  stage: tgz_release
  script: make -C algo release RELEASE_TAG=`cat algo/release`
  only:
    - /^feature-.*a.*\/release$/
  artifacts:
    paths:
    - algo/releases/vidjil-algo-`cat algo/release`.tar.gz
    - algo/releases/vidjil-algo-`cat algo/release`/vidjil-algo-`cat algo/release`_`uname -m`
    expire_in: 10 years
  allow_failure: false
  tags:
    - ubuntu-16.04-amd64

copy_release:
  stage: publish_release
  script:
    - |
      for repo in $ALGO_REPOSITORIES; do
        echo "Copying release to $repo"
        scp algo/releases/vidjil-algo*.tar.gz algo/releases/vidjil-algo*/vidjil-algo-*_* $repo
      done
      release_name=$(cat algo/release)
      ssh $VIDJIL_WWW "cd /var/www/static/releases; ln -sf vidjil-algo-${release_name}.tar.gz vidjil-algo-latest.tar.gz; ln -sf vidjil-algo-${release_name}_x86_64 vidjil-algo-latest_x86_64"
  when: manual
  only:
    - /^feature-.*a.*\/release$/

deploy_release_prod:
  stage: deploy_prod
  when: manual
  only:
    - /^feature-.*a.*\/release$/
  script:
    - |
      release_name=$(cat algo/release)
      ssh $DEPLOY_SERVER "cd releases/vidjil;\
          tar xvzf vidjil-algo-${release_name}.tar.gz;\
          make -C vidjil-algo-${release_name};\
          ln -sfT vidjil-algo-${release_name} next"

# Client

test_browser_unit:
  image: registry.gitlab.inria.fr/vidjil/vidjil/cypress_with_browsers:$CYPRESS_DOCKER_VERSION
  stage: test_unit
  script: 
    - npm -v
    - npm install --save-dev qunit
    - npm link nightmare --unsafe-perm=true ;
    - apt-get update && apt-get -y install xvfb grep
    - make demo data germline
    - make -C browser sha1
    - cp -p doc/analysis-example.vidjil browser/
    - make unit_browser
  artifacts:
    paths:
    - browser/
    expire_in: 7 day
    when: always
  only:
    - /^feature-.*c.*\/.*$/
    - /^hotfix-.*c.*\/.*$/
    - /^prod-client/
    - dev
    - schedules
  tags:
    - cidocker
  extends:
    - .need_for_quick_test



# Code quality

code_quality_custom:
  image: registry.gitlab.inria.fr/vidjil/vidjil/cypress_with_browsers:$CYPRESS_DOCKER_VERSION
  stage: test_quality
  script:
    - npm install -g jshint
    - make -C browser quality
  only:
    - /^feature-.*c.*\/.*$/
    - /^hotfix-.*c.*\/.*$/
    - /^prod-client/
    - dev
    - schedules
  tags:
    - cidocker
  extends:
    - .need_for_quick_test

# Server

test_server_unit:
    image: python:3.12-slim
    stage: test_unit
    script:
      - apt-get update && apt-get install -y --no-install-recommends build-essential gcc wget unzip procps
      - python3 -m pip install --no-cache -r requirements.txt
      - python3 -m pip install --no-cache -r requirements_tests.txt
      - python3 -m pip freeze > pip_freeze_requirements.txt
      - mkdir -p /mnt/upload/uploads/
      - wget http://www.vidjil.org/releases/vidjil-latest_x86_64 && mv vidjil-latest_x86_64 vidjil-algo && chmod +x vidjil-algo
      - make germline
      - make unit_server
    coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
    artifacts:
      reports:
        junit: server/unit_report.xml
        coverage_report:
          coverage_format: cobertura
          path: server/unit_coverage.xml
      paths:
        - pip_freeze_requirements.txt
        - server/unit_report.xml
        - server/unit_coverage.xml
      expire_in: 7 day
    only:
      - /^feature-.*s.*\/.*$/
      - /^hotfix-.*s.*\/.*$/
      - /^prod-server/
      - dev
      - schedules
    tags:
      - cidocker
    extends:
      - .need_for_quick_test


.setup_docker_server:
    # Build specific version of docker images
    - echo "CI_COMMIT_REF_NAME - $CI_COMMIT_REF_NAME"
    - echo "TIME $(date) - before pulling docker images" >> time.log
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE/$IMAGE_NAME_CLIENT
    - docker pull $CI_REGISTRY_IMAGE/$IMAGE_NAME_SERVER
    - docker tag $CI_REGISTRY_IMAGE/$IMAGE_NAME_CLIENT vidjil/client:test
    - docker tag $CI_REGISTRY_IMAGE/$IMAGE_NAME_SERVER vidjil/server:test
    - echo "TIME $(date) - after pulling docker images" >> time.log
    # Up py4web
    - cd docker
    - cp .env.docker-compose-interpolation .env
    - ln -sf docker-compose-ci-tests.yml docker-compose.override.yml
    - mkdir -p volumes
    - docker-compose config
    - docker-compose up -d mysql uwsgi
    - echo "TIME $(date) - after first compose up" >> ../time.log
    # Start other docker images
    - docker-compose up -d
    - docker ps
    # Execute a script of init database and mock (fake ?) data inside; to launch before executing tests
    - docker compose exec -w "/usr/share/vidjil/server/py4web/apps/vidjil/scripts/" uwsgi bash -c "source /usr/share/vidjil/venv/bin/activate && python3 load-sql.py -i /usr/share/vidjil/server/py4web/apps/vidjil/tests/functional/ci_erase.sql"
    - docker compose exec -w "/usr/share/vidjil/server/py4web/apps/vidjil/tests/functional/" uwsgi bash -c "source /usr/share/vidjil/venv/bin/activate && python3 init_test_db.py"
    - cd .. # Go to root git directory
    - echo "TIME $(date) - before other server script" >> time.log


.test_server_base_dind:
  image:
    name: pandoc/core:latest
    entrypoint: [""]
  stage: test_functional
  services:
    - docker:dind
  before_script:
    - apk update
    - apk add docker docker-compose make wget tar yq
    - !reference [.setup_docker_server]
  after_script:
    - echo "TIME $(date) - END OF SERVER JOB" >> time.log
    - docker ps
    - mkdir -p logs/after; cd docker; for service in `docker compose config | yq '.services[]|key'`; do docker logs vidjil-${service} > ../logs/after/${service}.log 2>&1; done
    - docker-compose down -v
    - cd .. && cat time.log
    - docker rmi "vidjil/server:test" "vidjil/client:test"
    - docker rmi $CI_REGISTRY_IMAGE/$IMAGE_NAME_CLIENT $CI_REGISTRY_IMAGE/$IMAGE_NAME_SERVER
  variables:
    IMAGE_NAME_CLIENT: dev-client/${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHA}
    IMAGE_NAME_SERVER: dev-server/${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHA}
  only:
    - /^feature-.*s.*\/.*$/
    - /^hotfix-.*s.*\/.*$/
    - /^prod-server/
    - dev
    - schedules
  tags:
    - ci.inria.fr
    - medium


# Deployment

deploy_review:
  stage: deploy_review
  script:
    - echo "$REVIEW_CONFIG_JS" > browser/js/conf.js
    - make browser
    - rsync -av --delete browser doc/analysis-example.vidjil $REVIEW_SERVER:$REVIEW_SERVER_PATH$CI_COMMIT_REF_SLUG
  dependencies: []
  environment:
    name: review-$CI_BUILD_REF_NAME
    url: http://$CI_COMMIT_REF_SLUG.ci.vidjil.org/?data=analysis-example.vidjil
    on_stop: stop_deploy_review
  only:
    - /^feature-.*c.*\/.*$/
    - /^hotfix-.*c.*\/.*$/
  tags:
    - web
  extends:
    - .need_for_independent_test
  allow_failure: true

deploy_review_server:
  stage: deploy_review
  script:
    - make browser demo
    - cp ./docker/vidjil-client/conf/conf.js ./browser/js/conf.js
    - sed -ri 's/^(uwsgi_pass )\$upstream_(.*)$/\1\2/g' docker/vidjil-client/conf/uwsgi.conf
    - mv docker docker_${CI_COMMIT_REF_SLUG}
    - cd docker_${CI_COMMIT_REF_SLUG}
    - cp .env.docker-compose-interpolation .env
    - echo "SMTP_EMAIL_SUBJECT_START='[Vidjil/CI][${CI_COMMIT_REF_NAME}]'" >> .env.ci-review
    - echo "PY4WEB_ADMIN_PASSWORD='${REVIEW_SERVER_ADMIN_PASSWORD}'" >> .env.ci-review
    - echo "VIRTUAL_HOST_NAME='${CI_COMMIT_REF_SLUG}'" >> .env.ci-review
    - echo "VIRTUAL_HOST='${CI_COMMIT_REF_SLUG}.server.ci.vidjil.org'" >> .env.ci-review
    - echo "FRONT_ADDRESS='${CI_COMMIT_REF_SLUG}.server.ci.vidjil.org'" >> .env.ci-review
    - echo "DB_ADDRESS='${CI_COMMIT_REF_SLUG}.server.ci.vidjil.org'" >> .env.ci-review
    - cat .env.ci-review
    - cd ..
    - rsync -av --exclude .git . $REVIEW_SERVER:$REVIEW_SERVER_PATH_SERVER${CI_COMMIT_REF_SLUG} || $(case "$?" in 0|23) exit 0 ;; *) exit $?; esac)
    - 'ssh $REVIEW_SERVER "
        cd $REVIEW_SERVER_PATH_SERVER;
        cd ${CI_COMMIT_REF_SLUG}/docker_${CI_COMMIT_REF_SLUG}; 
        echo "TIME - before pulling docker images - $(date)";
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY;
        docker pull $CI_REGISTRY_IMAGE/$IMAGE_NAME_CLIENT;
        docker pull $CI_REGISTRY_IMAGE/$IMAGE_NAME_SERVER;
        docker tag $CI_REGISTRY_IMAGE/$IMAGE_NAME_CLIENT vidjil/client:test;
        docker tag $CI_REGISTRY_IMAGE/$IMAGE_NAME_SERVER vidjil/server:test;
        echo "TIME - after pulling docker images - $(date)";
        bash ci/start_review_server.sh;
      "'
  environment:
    name: review_server-$CI_COMMIT_REF_SLUG
    url: http://$CI_COMMIT_REF_SLUG.server.ci.vidjil.org/
    on_stop: stop_deploy_review_server
    auto_stop_in: 2 months
  dependencies: []
  only:
    - /^feature-.*s.*\/.*$/
    - /^hotfix-.*s.*\/.*$/
  extends:
    - .need_for_independent_test
  artifacts:
    paths:
      - docker_${CI_COMMIT_REF_SLUG}/.env*
      - docker_${CI_COMMIT_REF_SLUG}/docker-compose*
      - docker_${CI_COMMIT_REF_SLUG}/vidjil-client/
      - docker_${CI_COMMIT_REF_SLUG}/vidjil-server/
    when: always
    expire_in: 7 day
  variables:
    IMAGE_NAME_CLIENT: dev-client/${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHA}
    IMAGE_NAME_SERVER: dev-server/${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHA}
  needs:
    - [build_test_server_docker]
  allow_failure: false


deploy_client:
  stage: deploy_prod
  image: testcontainers/sshd
  before_script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh    
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts  
  script:
    - ssh vidjil@$PROD_CLIENT_SERVER "
         cd $PROD_CLIENT_PATH
         && git fetch
         && git reset --hard origin/prod-client
         && make germline
         && cp doc/analysis-example.vidjil browser/
         && cd docker
         && docker-compose up -d nginx"
  environment:
    name: production
    url: https://$PROD_CLIENT_SERVER/?data=analysis-example.vidjil
  only:
    - prod-client
  tags:
    - cidocker
  needs:
    - deploy_docker
  
    
build_test_server_docker:
  stage: build_test_server_docker
  image: docker:latest
  services:
    - docker:dind
  before_script: []
  script:
    - echo $CI_REGISTRY_IMAGE:$IMAGE_NAME
    - echo "TIME $(date) - before building docker image" >> time.log
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # build and push the image to be used in subsequent stages
    - 'docker build 
        --no-cache
        --build-arg build_env=TEST 
        -t ${CI_REGISTRY_IMAGE}/$IMAGE_NAME
        -f docker/vidjil-$TYPE/Dockerfile
        ./'
    # Push image as commit and branch name to allow to use cache if another commit come to this branch
    - echo "TIME $(date) - before pushing docker image" >> time.log
    - docker push $CI_REGISTRY_IMAGE/$IMAGE_NAME
    - echo "TIME $(date) - after push" >> time.log
  parallel:
    matrix:
      - TYPE: [client, server]
  variables:
    IMAGE_NAME: dev-$TYPE/${CI_COMMIT_REF_SLUG}:${CI_COMMIT_SHA}
  only:
    - /^prod-server/
    - /^prod-client/
    - /^feature-.*s.*\/.*$/
    - /^feature-.*t.*\/.*$/
    - /^hotfix-.*s.*\/.*$/
    - /^hotfix-.*t.*\/.*$/
    - dev
  tags:
    - ci.inria.fr
    - small
  artifacts:
    paths:
      - time.log
    when: always
    expire_in: 7 day
  needs:
    - []

    
deploy_docker:
  stage: publish_release
  image: docker:latest
  services:
    - docker:dind
  script:
    - export CUR_DATE=`date +%Y-%m-%d`
    - export TYPE=`echo $CI_COMMIT_REF_NAME | awk '{ gsub(/prod-/, "") }{ print $1 }'`
    - export SHA=`echo $CI_COMMIT_SHA | awk '{ print substr($0, 0, 8) }'`
    - export TAG="vidjil/$TYPE:$CUR_DATE-$SHA"
    - docker login -u "$CI_DOCKER_USER" -p "$CI_DOCKER_PASSWORD" $CI_DOCKER
    - docker build --no-cache --build-arg build_env=PRODUCTION -t $TAG -f docker/vidjil-$TYPE/Dockerfile ./
    - docker push $TAG
    - docker tag $TAG "vidjil/$TYPE:latest"
    - docker push "vidjil/$TYPE:latest"
    - docker rmi $TAG "vidjil/$TYPE:latest"
  when: manual
  extends:
    - .need_for_independent_test
  only:
    - /^prod-server/
    - /^prod-client/
  tags:
    - ci.inria.fr
    - small

deploy_germlines:
  stage: deploy_prod
  script:
    - make -C germline get-all-data
    - make -C germline js
    - date=$(date +%Y-%m-%d)
    - tar cvzf germline-$date.tar.gz germline/*/*.fa germline/IMGT_RELEASE browser/js/germline.js
    - scp germline-$date.tar.gz $VIDJIL_WWW:$REMOTE_GERMLINE_DIR
  only:
    - manual
    - /^feature-.*g.*\/.*$/
    


stop_deploy_review:
  stage: deploy_review
  variables:
    GIT_STRATEGY: none
  script:
    - ssh $REVIEW_SERVER "rm -rf $REVIEW_SERVER_PATH$CI_COMMIT_REF_SLUG"
  when: manual
  environment:
    name: review-$CI_BUILD_REF_NAME
    action: stop
  dependencies: []
  only:
    - /^feature-.*c.*\/.*$/
    - /^hotfix-.*c.*\/.*$/
  tags:
    - web

stop_deploy_review_server:
  stage: deploy_review
  script:
    - 'ssh $REVIEW_SERVER "set -o xtrace; 
        cd $REVIEW_SERVER_PATH_SERVER${CI_COMMIT_REF_SLUG}/docker_${CI_COMMIT_REF_SLUG};
        docker compose down -v; 
        cd ; 
        sudo ./scripts/remove_server_folder.sh ${CI_COMMIT_REF_SLUG};
        docker system prune -af --filter until=20m;
        "'
  when: manual
  needs:
    - [deploy_review_server]
  environment:
    name: review_server-$CI_COMMIT_REF_SLUG
    action: stop
  only:
    - /^feature-.*s.*\/.*$/
    - /^hotfix-.*s.*\/.*$/
  allow_failure: true

