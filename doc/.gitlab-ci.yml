
build_doc:
  image: python:3.12
  stage: build_doc
  before_script:
    - pip install -r doc/requirements.txt
    - pip install requests
  script:
    - make -C doc html
    - cd tools; python validate-links.py
  artifacts:
    paths:
      - site/
    expire_in: 1 month
    when: always
  only:
      - /^[^\/]*doc[^\/]*\//
      # branch name should contain doc before the first /
      # eg.: doc/blabla or feature-adoc/blabla
      - /^feature-.*a.*\/release$/
  tags:
    - cidocker
  allow_failure: true

deploy_doc:
  stage: deploy_prod
  script:
    - scp -r site/ $VIDJIL_WWW:doc/
  when: manual
  only:
      - /^[^\/]*doc[^\/]*\//
      - /^feature-.*a.*\/release$/

build_tutorial_pdf:
  stage: build_doc
  image: leplusorg/latex:main
  before_script: []
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
      - doc/tutorial/**/*
      when: always
  script:
    - make -C doc/tutorial mastering-vidjil.pdf
  artifacts:
    paths:
      - doc/tutorial/mastering-vidjil.pdf
  tags:
    - ci.inria.fr
    - medium

build_tutorial_html:
  stage: build_doc
  image: leplusorg/latex:main
  before_script: []
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
      - doc/tutorial/**/*
      when: always
  script:
    - make -C doc/tutorial mastering-vidjil.html
  artifacts:
    paths:
      - doc/tutorial/mastering-vidjil.html
  tags:
    - ci.inria.fr
    - medium

deploy_tutorial:
  stage: deploy_prod
  before_script: []
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
      - doc/tutorial/**/*
      when: manual
  script:
    - scp -r doc/tutorial/* $VIDJIL_WWW:/var/www/static/doc/tutorial/
      
  
